# Render Infrastructure as Code (Blueprint) Specification for SupportNova
services:
  # FastAPI Backend Web Service
  - type: web
    name: supportnova-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.src.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ENABLE_DOCS
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: supportnova-postgres
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "https://supportnova-frontend.onrender.com"

  # Next.js / React Frontend Service
  - type: web
    name: supportnova-frontend
    env: node
    buildCommand: "cd frontend && npm install && npm run build"
    startCommand: "cd frontend && npm start"
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production

databases:
  # Managed PostgreSQL Database Service
  - name: supportnova-postgres
    databaseName: supportnova_db
    user: supportnova_user
    plan: free
