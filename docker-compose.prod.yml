version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: supportnova_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-supportnova_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supportnova_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-supportnova_production_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -u ${POSTGRES_USER:-supportnova_user} -d ${POSTGRES_DB:-supportnova_production_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: supportnova_backend_prod
    restart: always
    environment:
      - ENVIRONMENT=production
      - ENABLE_DOCS=${ENABLE_DOCS:-false}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-supportnova_user}:${POSTGRES_PASSWORD:-supportnova_secure_password_2026}@postgres:5432/${POSTGRES_DB:-supportnova_production_db}
      - JWT_SECRET=${JWT_SECRET_KEY:-supportnova_super_secret_jwt_key_2026_prod}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - PORT=8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: supportnova_frontend_prod
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
    ports:
      - "80:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_prod_data:
